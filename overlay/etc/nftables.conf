#!/usr/sbin/nft -f
# Firewall of the Tinker Edge R image: nothing from the network reaches the board except
# SSH (22), ping and mDNS (so that tinker-edge-r.local works). Answers to connections the
# board opened itself are allowed. Outgoing traffic is not restricted. Open more ports by
# adding them to the "input" chain below, then:  sudo systemctl restart nftables
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # ICMP: ping, and for IPv6 the neighbour and router discovery that it cannot work without
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # DHCP answers (the client sees them before a connection is tracked)
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        tcp dport 22 accept          # SSH
        udp dport 5353 accept        # mDNS
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
