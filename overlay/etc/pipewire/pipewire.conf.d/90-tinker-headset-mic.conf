# Tinker Edge R: the microphone of a headset at the 3.5 mm jack (RK809 codec) arrives in the RIGHT channel of the codec's capture device, the left one is
# silent; programs that record mono (left) or mix both get almost nothing. This makes a mono source from the right channel and the default source.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Headset microphone"
      capture.props = {
        node.name = "tinker-headset-mic.capture"
        target.object = "alsa_input.platform-rk809-sound.stereo-fallback"
        audio.position = [ FR ]
        stream.dont-remix = true
        node.passive = true
      }
      playback.props = {
        node.name = "tinker-headset-mic"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
]
