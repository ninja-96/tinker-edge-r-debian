# Tinker Edge R: names for the two sound cards (both are "Built-in Audio Stereo" otherwise), and the 3.5 mm jack stays the default output when HDMI audio
# appears (HDMI audio came with release 0.5; before, the jack was the only output)
monitor.alsa.rules = [
  { matches = [ { node.name = "alsa_output.platform-rk809-sound.stereo-fallback" } ]
    actions = { update-props = { node.description = "Headphones (3.5 mm jack)", node.nick = "Headphones", priority.session = 1100, priority.driver = 1100 } } }
  { matches = [ { node.name = "alsa_input.platform-rk809-sound.stereo-fallback" } ]
    actions = { update-props = { node.description = "3.5 mm jack input (stereo; a headset microphone is the right channel)", node.nick = "Jack input" } } }
  { matches = [ { node.name = "alsa_output.platform-hdmi-sound.stereo-fallback" } ]
    actions = { update-props = { node.description = "HDMI", node.nick = "HDMI", priority.session = 900, priority.driver = 900 } } }
]
