# Pinned upstream sources. Sourced by the scripts.
# Downloaded by the build: Linux, U-Boot, Rockchip mpp (source, Apache-2.0) and TF-A on demand. Entries marked
# 'provenance' are NOT downloaded: the files are in the repository, these record
# where they came from.
LINUX_VERSION=6.18.59
KERNEL_LOCALVERSION=-tinker-edge-r   # kernel release becomes <LINUX_VERSION><this>
LINUX_SHA256=53a55ac9863a5547e292b8e381d4e4c2240dd1127d5428a7c44dbc550be23963

UBOOT_REPO=https://github.com/u-boot/u-boot.git
UBOOT_TAG=v2026.10

# Open BL31 (ARM Trusted Firmware-A) for the free boot chain
TFA_REPO=https://github.com/ARM-software/arm-trusted-firmware.git
TFA_TAG=v2.15.0

# provenance of blobs/rockchip/
RKBIN_REPO=https://github.com/rockchip-linux/rkbin.git
RKBIN_REV=3e288fe814e059dd06833495f845cab04ac20a5c

# Vendor BSP kernel: reference for mpp_service and the RK3399Pro NPU PCIe hooks
RK_KERNEL_REPO=https://github.com/rockchip-linux/kernel.git
RK_KERNEL_BRANCH=develop-6.12
RK_KERNEL_REV=470f9dccbdc42e7b8a824d0a5c5640a10e9457d2

MPP_REPO=https://github.com/rockchip-linux/mpp.git
MPP_REV=14729dd578e570e5f00fd1dd2113f5429012d64b

# NPU firmware, npu_transfer_proxy, librknn_api (Apache-2.0)
RK3399PRO_NPU_REPO=https://github.com/airockchip/RK3399Pro_npu.git
RK3399PRO_NPU_REV=8858114555f1700e41e185b14ec3d266342f8059

# provenance of third_party/rkdeveloptool
RKDEVELOPTOOL_REPO=https://github.com/rockchip-linux/rkdeveloptool.git
RKDEVELOPTOOL_REV=304f073752fd25c854e1bcf05d8e7f925b1f4e14

# Rockchip GStreamer plugins (rockchipmpp: mpph264enc, mppvideodec, mppjpegenc, ...), LGPL-2.1,
# built by scripts/build-gst-rockchip.sh. Branch gstreamer-rockchip of the Rockchip mirror.
GST_ROCKCHIP_REPO=https://github.com/JeffyCN/mirrors.git
GST_ROCKCHIP_BRANCH=gstreamer-rockchip
GST_ROCKCHIP_REV=ebc758a13d425d34858a98dbcdb4a4bd702daa0f

# The open NPU stack (release 0.4.1): built by scripts/build-npu-open.sh for the NPU die. TIM-VX and the TFLite VX delegate are taken from their
# main branches; TIM-VX is built with the SDK headers of v1.1.32 (Vivante 6.4.6 = the driver in Rockchip's firmware): the headers of newer
# SDKs enlarge vx_hardware_caps_params_ext_t, which the 6.4.6 driver refuses (-10). LiteRT 2.3.2 (below) with XNNPACK (ARMv8.0 kernels).
TIMVX_REPO=https://github.com/VeriSilicon/TIM-VX.git
TIMVX_REV=702715d714277376d7ff466b7b72833ff57564c1          # main, 2026-03-30 (after v1.2.22)
TIMVX_SDK_HEADERS_REV=47119a569dcdc1cae7720c126222c6c0991d1519   # tag v1.1.32: prebuilt-sdk/x86_64_linux/include = SDK 6.4.6 headers
TFLITE_VX_DELEGATE_REPO=https://github.com/VeriSilicon/tflite-vx-delegate.git
TFLITE_VX_DELEGATE_REV=b76047d46acdac62cb30874590fb91999e631687   # main, 2026-03-12
FFT2D_URL=https://storage.googleapis.com/mirror.tensorflow.org/github.com/petewarden/OouraFFT/archive/v1.0.tar.gz
FFT2D_SHA256=5f4dabc2ae21e1f537425d58a49cdca1c49ea11db0d6271e2a4b27e9697548eb
# LiteRT (google-ai-edge/LiteRT): TensorFlow Lite as tflite/, the engine of the NPU die (scripts/build-npu-open.sh)
LITERT_VERSION=2.3.2
